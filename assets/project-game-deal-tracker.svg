<title id="t">game-deal-tracker</title><desc id="d">Featured project: game-deal-tracker. An automated Python pipeline pulls PC game prices from a REST API into timestamped SQLite snapshots, then SQL joins and aggregations surface top deals, store comparisons and price trends in a Plotly Dash dashboard.</desc>
